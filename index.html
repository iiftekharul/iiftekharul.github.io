<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real 3D Interactive Flipbook Reader</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PageFlip (StPageFlip) Library -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            roseGold: '#D88383',
            roseDark: '#B04E4E',
            warmCream: '#FAF7F5',
            softPaper: '#FFFDFB',
            dustyPink: '#F3D7D7',
          },
          fontFamily: {
            serif: ['Georgia', 'Cambria', 'serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FAF7F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    .flipbook-stage {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 550px;
    }

    /* Outer wrapper holding 3D canvas */
    #flipbook-mount {
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      border-radius: 8px;
    }

    /* Real-life 3D Page Styling */
    .page {
      background-color: #FFFDFB;
      border: 1px solid #f0e6e6;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .page-cover {
      background: linear-gradient(135deg, #FAF7F5 0%, #F3D7D7 100%);
      color: #333;
      border: 2px solid #D88383;
    }

    .page-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
    }

    .page-image-container {
      width: 100%;
      height: calc(100% - 35px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 8px;
      background: #fdfbfb;
      cursor: zoom-in;
    }

    .page-image-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      transition: transform 0.2s ease;
    }

    .page-image-container:hover img {
      transform: scale(1.02);
    }

    .page-number {
      position: absolute;
      bottom: 10px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      font-family: Georgia, serif;
    }
  </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center justify-center min-h-screen">

  <div id="flipbook-wrapper" class="w-full max-w-5xl bg-white rounded-2xl shadow-xl p-4 md:p-8 transition-all duration-300">
    
    <!-- Header Section -->
    <header class="text-center mb-6 relative">
      <span class="text-xs uppercase tracking-widest text-roseGold font-bold mb-1 block">Real 3D Interactive Album</span>
      <h1 class="text-2xl md:text-3xl font-serif text-gray-800 font-bold">Custom Photo Flipbook</h1>
      <p class="text-sm text-gray-500 mt-1">Upload images to generate a real-life 3D paper page-turn experience</p>
      
      <!-- Upload Button -->
      <div class="mt-4">
        <label for="image-upload" class="inline-flex items-center gap-2 bg-roseGold hover:bg-roseDark text-white px-5 py-2.5 rounded-lg shadow-md transition-all cursor-pointer text-sm font-semibold">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <span id="upload-label-text">Upload Images</span>
        </label>
        <input type="file" id="image-upload" multiple accept="image/*" class="hidden" />
      </div>
    </header>

    <!-- Flipbook Stage -->
    <div class="flipbook-stage mb-6" id="stage-container">
      <div id="flipbook-mount"></div>
    </div>

    <!-- Controls Toolbar -->
    <div class="flex flex-wrap items-center justify-between gap-3 bg-warmCream p-3 rounded-xl border border-dustyPink/40">
      <div class="flex items-center gap-1 sm:gap-2">
        <button id="btn-first" title="First Page" class="p-2.5 px-3 bg-white hover:bg-roseGold hover:text-white text-gray-700 rounded-lg shadow-sm border border-gray-200 transition-colors text-sm">
          <i class="fa-solid fa-backward-step"></i>
        </button>
        <button id="btn-prev" title="Previous Page" class="p-2.5 px-3 bg-white hover:bg-roseGold hover:text-white text-gray-700 rounded-lg shadow-sm border border-gray-200 transition-colors text-sm">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <span class="text-xs md:text-sm font-serif px-2 text-gray-600 font-semibold select-none min-w-[90px] text-center" id="page-indicator">
          Page 1 of 2
        </span>
        <button id="btn-next" title="Next Page" class="p-2.5 px-3 bg-white hover:bg-roseGold hover:text-white text-gray-700 rounded-lg shadow-sm border border-gray-200 transition-colors text-sm">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
        <button id="btn-last" title="Last Page" class="p-2.5 px-3 bg-white hover:bg-roseGold hover:text-white text-gray-700 rounded-lg shadow-sm border border-gray-200 transition-colors text-sm">
          <i class="fa-solid fa-forward-step"></i>
        </button>
      </div>

      <div class="flex items-center gap-2">
        <button id="btn-autoplay" title="Toggle Auto Play" class="flex items-center gap-1.5 p-2.5 px-3 bg-white hover:bg-roseGold hover:text-white text-gray-700 rounded-lg shadow-sm border border-gray-200 transition-colors text-xs font-semibold">
          <i id="autoplay-icon" class="fa-solid fa-play"></i>
          <span class="hidden sm:inline">Auto</span>
        </button>

        <button id="btn-sound" title="Toggle Sound" class="p-2.5 px-3 bg-white hover:bg-roseGold hover:text-white text-roseGold rounded-lg shadow-sm border border-gray-200 transition-colors text-sm">
          <i id="sound-icon" class="fa-solid fa-volume-high"></i>
        </button>

        <button id="btn-fullscreen" title="Toggle Stage Fullscreen" class="p-2.5 px-3 bg-white hover:bg-roseGold hover:text-white text-gray-700 rounded-lg shadow-sm border border-gray-200 transition-colors text-sm">
          <i class="fa-solid fa-expand"></i>
        </button>
      </div>
    </div>

  </div>

  <!-- FULLSCREEN IMAGE LIGHTBOX MODAL -->
  <div id="image-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex-col items-center justify-center p-4 backdrop-blur-sm transition-opacity duration-300">
    <button id="close-modal" class="absolute top-4 right-4 text-white text-2xl p-3 hover:text-roseGold transition-colors focus:outline-none">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <img id="modal-image" src="" alt="Fullscreen View" class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl" />
    <p class="text-white/70 text-xs mt-3 font-serif">Click anywhere outside or press ESC to close</p>
  </div>

  <script>
    let pageFlip = null;
    let autoPlayInterval = null;
    let soundEnabled = true;

    // Realistic Web AudioSynthesizer for Paper Turn Sound
    function playPageTurnSound() {
      if (!soundEnabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        const bufferSize = ctx.sampleRate * 0.15;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1000, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.12);
        filter.Q.value = 1.5;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.01, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        noise.start();
        noise.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }

    function getBookDimensions() {
      const screenWidth = window.innerWidth;
      if (screenWidth < 640) {
        return { width: 280, height: 400 };
      } else if (screenWidth < 1024) {
        return { width: 340, height: 480 };
      } else {
        return { width: 400, height: 520 };
      }
    }

    function createPageElement(htmlContent, extraClass = '') {
      const div = document.createElement('div');
      div.className = `page ${extraClass}`;
      div.innerHTML = htmlContent;
      return div;
    }

    function buildDefaultPages() {
      return [
        createPageElement(`
          <div class="page-content text-center flex flex-col justify-between items-center h-full py-8">
            <div class="mt-4">
              <span class="text-3xl text-roseGold"><i class="fa-solid fa-book-open"></i></span>
              <p class="text-xs uppercase tracking-widest text-roseDark font-bold mt-2">Personalized Album</p>
            </div>
            <div class="my-auto px-4">
              <h2 class="font-serif text-2xl md:text-3xl font-bold text-gray-800 leading-tight mb-3">Welcome to Your 3D Flipbook</h2>
              <div class="w-16 h-0.5 bg-roseGold mx-auto my-3"></div>
              <p class="text-sm font-serif text-gray-600 italic">Click "Upload Images" above to see your photos!</p>
            </div>
            <div class="mb-4">
              <p class="text-xs text-gray-500 italic">Grab page corner to curl & turn ➔</p>
            </div>
          </div>
        `, 'page-cover'),
        createPageElement(`
          <div class="page-content text-center flex flex-col justify-between items-center h-full py-8">
            <div class="my-auto">
              <span class="text-3xl text-roseGold"><i class="fa-solid fa-heart"></i></span>
              <p class="font-serif text-lg font-bold text-gray-800 mt-2">The End</p>
              <p class="text-xs text-roseDark font-semibold">Upload photos to replace this preview</p>
            </div>
          </div>
        `, 'page-cover')
      ];
    }

    function initFlipbook(pagesArray) {
      const mountPoint = document.getElementById('flipbook-mount');
      mountPoint.innerHTML = ''; // Wipe existing canvas DOM

      if (pageFlip) {
        try { pageFlip.destroy(); } catch (e) {}
        pageFlip = null;
      }

      const dims = getBookDimensions();

      // Explicit real-life 3D mode initialization
      pageFlip = new St.PageFlip(mountPoint, {
        width: dims.width,
        height: dims.height,
        size: "fixed",
        minWidth: 260,
        maxWidth: 500,
        minHeight: 380,
        maxHeight: 650,
        drawShadow: true,
        showCover: true,
        usePortrait: window.innerWidth < 640,
        maxShadowOpacity: 0.8,
        flippingTime: 1000,
        useMouseEvents: true,
        swipeDistance: 30,
        clickEventForward: true
      });

      pageFlip.loadFromHTML(pagesArray);

      pageFlip.on('flip', () => {
        playPageTurnSound();
        updateIndicator();
      });

      updateIndicator();
      attachImageClickEvents();
    }

    function updateIndicator() {
      if (!pageFlip) return;
      const current = pageFlip.getCurrentPageIndex() + 1;
      const total = pageFlip.getPageCount();
      document.getElementById('page-indicator').innerText = `Page ${current} of ${total}`;
    }

    // Modal Lightbox functionality
    function attachImageClickEvents() {
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-image');

      document.querySelectorAll('.page-image-container img').forEach(img => {
        img.onclick = (e) => {
          e.stopPropagation();
          modalImg.src = img.src;
          modal.classList.remove('hidden');
          modal.classList.add('flex');
        };
      });
    }

    document.getElementById('close-modal').addEventListener('click', () => {
      const modal = document.getElementById('image-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    });

    document.getElementById('image-modal').addEventListener('click', (e) => {
      if (e.target.id === 'image-modal') {
        const modal = document.getElementById('image-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const modal = document.getElementById('image-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    });

    // File Upload Handler
    document.getElementById('image-upload').addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      const labelText = document.getElementById('upload-label-text');
      labelText.innerText = "Rendering 3D Mesh...";

      const newPages = [];

      // Add Front Cover
      newPages.push(createPageElement(`
        <div class="page-content text-center flex flex-col justify-between items-center h-full py-8">
          <div class="mt-4">
            <span class="text-3xl text-roseGold"><i class="fa-solid fa-images"></i></span>
            <p class="text-xs uppercase tracking-widest text-roseDark font-bold mt-2">Custom Photo Album</p>
          </div>
          <div class="my-auto px-4">
            <h2 class="font-serif text-2xl font-bold text-gray-800 leading-tight mb-2">My Photo Album</h2>
            <div class="w-16 h-0.5 bg-roseGold mx-auto my-3"></div>
            <p class="text-sm font-serif text-gray-600 italic">${files.length} Photos Loaded</p>
          </div>
          <div class="mb-4">
            <p class="text-xs text-gray-500 italic">Grab corner to curl page ➔</p>
          </div>
        </div>
      `, 'page-cover'));

      // Add uploaded photo pages
      files.forEach((file, index) => {
        const url = URL.createObjectURL(file);
        newPages.push(createPageElement(`
          <div class="page-content">
            <div class="page-image-container" title="Click to view full screen">
              <img src="${url}" alt="Uploaded Photo ${index + 1}" />
            </div>
            <div class="page-number">- ${index + 1} -</div>
          </div>
        `));
      });

      // Add Back Cover
      newPages.push(createPageElement(`
        <div class="page-content text-center flex flex-col justify-between items-center h-full py-8">
          <div class="my-auto">
            <span class="text-3xl text-roseGold"><i class="fa-solid fa-heart"></i></span>
            <p class="font-serif text-xl font-bold text-gray-800 mt-2">The End</p>
            <p class="text-xs text-roseDark font-semibold mt-1">Thank You for Viewing</p>
          </div>
        </div>
      `, 'page-cover'));

      initFlipbook(newPages);
      labelText.innerText = "Upload Images";
    });

    document.addEventListener('DOMContentLoaded', () => {
      initFlipbook(buildDefaultPages());

      document.getElementById('btn-next').addEventListener('click', () => {
        if (pageFlip) pageFlip.flipNext();
      });

      document.getElementById('btn-prev').addEventListener('click', () => {
        if (pageFlip) pageFlip.flipPrev();
      });

      document.getElementById('btn-first').addEventListener('click', () => {
        if (pageFlip) pageFlip.flip(0);
      });

      document.getElementById('btn-last').addEventListener('click', () => {
        if (pageFlip) pageFlip.flip(pageFlip.getPageCount() - 1);
      });

      // Auto Play Toggle
      const autoBtn = document.getElementById('btn-autoplay');
      const autoIcon = document.getElementById('autoplay-icon');
      autoBtn.addEventListener('click', () => {
        if (autoPlayInterval) {
          clearInterval(autoPlayInterval);
          autoPlayInterval = null;
          autoIcon.className = 'fa-solid fa-play';
          autoBtn.classList.remove('bg-roseGold', 'text-white');
          autoBtn.classList.add('bg-white', 'text-gray-700');
        } else {
          autoIcon.className = 'fa-solid fa-pause';
          autoBtn.classList.remove('bg-white', 'text-gray-700');
          autoBtn.classList.add('bg-roseGold', 'text-white');
          autoPlayInterval = setInterval(() => {
            if (pageFlip) {
              if (pageFlip.getCurrentPageIndex() >= pageFlip.getPageCount() - 1) {
                pageFlip.flip(0);
              } else {
                pageFlip.flipNext();
              }
            }
          }, 3500);
        }
      });

      // Sound Toggle
      const soundBtn = document.getElementById('btn-sound');
      const soundIcon = document.getElementById('sound-icon');
      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        if (soundEnabled) {
          soundIcon.className = 'fa-solid fa-volume-high';
          soundBtn.classList.add('text-roseGold');
          soundBtn.classList.remove('text-gray-400');
        } else {
          soundIcon.className = 'fa-solid fa-volume-xmark';
          soundBtn.classList.remove('text-roseGold');
          soundBtn.classList.add('text-gray-400');
        }
      });

      // Stage Fullscreen Toggle
      document.getElementById('btn-fullscreen').addEventListener('click', () => {
        const stage = document.getElementById('flipbook-wrapper');
        if (!document.fullscreenElement) {
          if (stage.requestFullscreen) {
            stage.requestFullscreen();
          } else if (stage.webkitRequestFullscreen) {
            stage.webkitRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      });

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (pageFlip) {
            initFlipbook(buildDefaultPages());
          }
        }, 250);
      });
    });
  </script>
</body>
</html>
