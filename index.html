<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>High Quality 3D Flipbook</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- StPageFlip Engine with Canvas Mesh Curling -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            roseGold: '#D88383',
            roseDark: '#B04E4E',
            warmCream: '#FAF7F5',
            softPaper: '#FFFDFB',
            dustyPink: '#F3D7D7',
          },
          fontFamily: {
            serif: ['Georgia', 'Cambria', 'serif'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #FAF7F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 10px;
    }

    /* Outer Wrapper Card */
    #app-viewport {
      width: 100%;
      max-width: 1200px;
      background: #ffffff;
      border-radius: 1.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.12);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
    }

    /* Fullscreen Stage Override */
    #app-viewport:fullscreen,
    #app-viewport:-webkit-full-screen {
      max-width: 100vw !important;
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      padding: 2rem !important;
      justify-content: space-between !important;
      background: #FAF7F5 !important;
    }

    /* 3D Large Stage Container */
    .stage-container {
      width: 100%;
      min-height: 620px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1rem;
      position: relative;
    }

    /* StPageFlip Canvas Parent */
    .stpageflip-container {
      margin: 0 auto;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
      border-radius: 8px;
    }

    /* Page Styles */
    .page {
      background-color: #FFFDFB;
      background-image: linear-gradient(to right, rgba(0,0,0,0.06) 0%, rgba(0,0,0,0) 6%);
      overflow: hidden;
      border: 1px solid #f0e6e6;
      box-sizing: border-box;
    }

    .page-cover {
      background: linear-gradient(135deg, #FAF7F5 0%, #F3D7D7 100%);
      color: #333;
      border: 2px solid #D88383;
    }

    .page-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      position: relative;
      box-sizing: border-box;
    }

    .page-image-container {
      width: 100%;
      height: calc(100% - 30px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 8px;
      background: #fdfbfb;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
      cursor: zoom-in;
    }

    .page-image-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .page-number {
      position: absolute;
      bottom: 10px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.8rem;
      color: #888888;
      font-family: Georgia, serif;
    }
  </style>
</head>
<body>

  <div id="app-viewport">
    
    <!-- Large 3D Stage -->
    <div class="stage-container" id="stage-container">
      <div id="flipbook" class="stpageflip-container">
        
        <!-- DEFAULT FRONT COVER -->
        <div class="page page-cover">
          <div class="page-content text-center flex flex-col justify-between items-center h-full py-10">
            <div class="mt-4">
              <span class="text-4xl text-roseGold"><i class="fa-solid fa-book-open"></i></span>
              <p class="text-xs uppercase tracking-widest text-roseDark font-bold mt-3">3D Interactive Album</p>
            </div>
            <div class="my-auto px-4">
              <h2 class="font-serif text-3xl font-bold text-gray-800 leading-tight mb-3">3D Paper Curl Magazine</h2>
              <div class="w-20 h-0.5 bg-roseGold mx-auto my-3"></div>
              <p class="text-base font-serif text-gray-600 italic">Grab page corner with mouse to drag & curl!</p>
            </div>
            <div class="mb-4">
              <p class="text-xs text-gray-500 italic">Drag corner to turn page ➔</p>
            </div>
          </div>
        </div>

        <!-- DEFAULT INSIDE DEMO PAGE -->
        <div class="page">
          <div class="page-content text-center flex flex-col justify-center items-center h-full">
            <h3 class="font-serif text-2xl font-bold text-gray-800 mb-3">Real Paper Mesh Physics</h3>
            <p class="text-sm text-gray-600 max-w-sm leading-relaxed">Click "Upload Images" below to load your photos into this high quality 3D book.</p>
            <div class="page-number">- 1 -</div>
          </div>
        </div>

        <!-- DEFAULT BACK COVER -->
        <div class="page page-cover">
          <div class="page-content text-center flex flex-col justify-center items-center h-full py-10">
            <span class="text-4xl text-roseGold"><i class="fa-solid fa-heart"></i></span>
            <p class="font-serif text-xl font-bold text-gray-800 mt-3">The End</p>
          </div>
        </div>

      </div>
    </div>

    <!-- Controls Toolbar -->
    <div class="w-full flex flex-wrap items-center justify-between gap-3 bg-warmCream p-3 rounded-xl border border-dustyPink/40">
      
      <!-- Upload Button inside Toolbar -->
      <div>
        <label for="image-upload" class="inline-flex items-center gap-2 bg-roseGold hover:bg-roseDark text-white px-5 py-2.5 rounded-lg shadow-sm transition-all cursor-pointer text-sm font-semibold">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <span>Upload Images</span>
        </label>
        <input type="file" id="image-upload" multiple accept="image/*" class="hidden" />
      </div>

      <!-- Page Navigation Controls -->
      <div class="flex items-center gap-1 sm:gap-2">
        <button id="btn-first" title="First Page" class="p-2.5 px-3.5 bg-white hover:bg-roseGold hover:text-white text-gray-700 rounded-lg shadow-sm border border-gray-200 transition-colors text-sm">
          <i class="fa-solid fa-backward-step"></i>
        </button>
        <button id="btn-prev" title="Previous Page" class="p-2.5 px-3.5 bg-white hover:bg-roseGold hover:text-white text-gray-700 rounded-lg shadow-sm border border-gray-200 transition-colors text-sm">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <span class="text-sm font-serif px-3 text-gray-600 font-semibold select-none min-w-[100px] text-center" id="page-indicator">
          Page 1 of 3
        </span>
        <button id="btn-next" title="Next Page" class="p-2.5 px-3.5 bg-white hover:bg-roseGold hover:text-white text-gray-700 rounded-lg shadow-sm border border-gray-200 transition-colors text-sm">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
        <button id="btn-last" title="Last Page" class="p-2.5 px-3.5 bg-white hover:bg-roseGold hover:text-white text-gray-700 rounded-lg shadow-sm border border-gray-200 transition-colors text-sm">
          <i class="fa-solid fa-forward-step"></i>
        </button>
      </div>

      <!-- Secondary Action Controls -->
      <div class="flex items-center gap-2">
        <button id="btn-autoplay" title="Toggle Auto Play" class="flex items-center gap-1.5 p-2.5 px-3.5 bg-white hover:bg-roseGold hover:text-white text-gray-700 rounded-lg shadow-sm border border-gray-200 transition-colors text-xs font-semibold">
          <i id="autoplay-icon" class="fa-solid fa-play"></i>
          <span class="hidden sm:inline">Auto</span>
        </button>

        <button id="btn-sound" title="Toggle Sound" class="p-2.5 px-3.5 bg-white hover:bg-roseGold hover:text-white text-roseGold rounded-lg shadow-sm border border-gray-200 transition-colors text-sm">
          <i id="sound-icon" class="fa-solid fa-volume-high"></i>
        </button>

        <button id="btn-fullscreen" title="Toggle Stage Fullscreen" class="p-2.5 px-3.5 bg-white hover:bg-roseGold hover:text-white text-gray-700 rounded-lg shadow-sm border border-gray-200 transition-colors text-sm">
          <i class="fa-solid fa-expand"></i>
        </button>
      </div>

    </div>

  </div>

  <!-- FULLSCREEN LIGHTBOX MODAL FOR IMAGES -->
  <div id="image-modal" class="fixed inset-0 bg-black/95 z-[99999] hidden flex-col items-center justify-center p-4 backdrop-blur-md">
    <button id="close-modal" class="absolute top-5 right-5 text-white text-3xl p-3 hover:text-roseGold transition-colors focus:outline-none">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <img id="modal-image" src="" alt="Full Screen View" class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl" />
    <p class="text-white/70 text-xs mt-3 font-serif">Click anywhere or press ESC to close</p>
  </div>

  <script>
    let pageFlip = null;
    let autoPlayInterval = null;
    let soundEnabled = true;

    // Web Audio Synthesizer for Paper Turn Sound
    function playPageTurnSound() {
      if (!soundEnabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        const bufferSize = ctx.sampleRate * 0.15;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1000, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.12);
        filter.Q.value = 1.5;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.01, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        noise.start();
        noise.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }

    // High Resolution Dynamic Aspect Ratio
    function getBookDimensions() {
      const screenWidth = window.innerWidth;
      if (screenWidth < 640) {
        return { width: 320, height: 460 };
      } else if (screenWidth < 1024) {
        return { width: 420, height: 580 };
      } else {
        return { width: 480, height: 640 }; // Large HQ Aspect Ratio
      }
    }

    function initFlipbook() {
      const container = document.getElementById('flipbook');
      if (!container) return;

      const dims = getBookDimensions();

      if (pageFlip) {
        try { pageFlip.destroy(); } catch (err) {}
        pageFlip = null;
      }

      pageFlip = new St.PageFlip(container, {
        width: dims.width,
        height: dims.height,
        size: "fixed",
        minWidth: 300,
        maxWidth: 700,
        minHeight: 400,
        maxHeight: 900,
        drawShadow: true,
        showCover: true,
        usePortrait: window.innerWidth < 640,
        maxShadowOpacity: 0.8,
        flippingTime: 1000,
        useMouseEvents: true, // Native 3D Mouse Corner Peeling & Curling
        swipeDistance: 15,
        clickEventForward: true
      });

      const pages = container.querySelectorAll('.page');
      if (pages.length > 0) {
        pageFlip.loadFromHTML(pages);
      }

      pageFlip.on('flip', () => {
        playPageTurnSound();
        updateIndicator();
      });

      updateIndicator();
      attachImageEvents();
    }

    function updateIndicator() {
      if (!pageFlip) return;
      const current = pageFlip.getCurrentPageIndex() + 1;
      const total = pageFlip.getPageCount();
      document.getElementById('page-indicator').innerText = `Page ${current} of ${total}`;
    }

    function attachImageEvents() {
      document.querySelectorAll('.page-image-container img').forEach(img => {
        img.onclick = (e) => {
          e.stopPropagation();
          document.getElementById('modal-image').src = img.src;
          const modal = document.getElementById('image-modal');
          modal.classList.remove('hidden');
          modal.classList.add('flex');
        };
      });
    }

    // Dynamic Image Upload Handling
    document.getElementById('image-upload').addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      const stage = document.getElementById('stage-container');
      stage.innerHTML = '<div id="flipbook" class="stpageflip-container"></div>';
      const container = document.getElementById('flipbook');

      // Front Cover
      const coverPage = document.createElement('div');
      coverPage.className = 'page page-cover';
      coverPage.innerHTML = `
        <div class="page-content text-center flex flex-col justify-between items-center h-full py-10">
          <div class="mt-4">
            <span class="text-4xl text-roseGold"><i class="fa-solid fa-images"></i></span>
            <p class="text-xs uppercase tracking-widest text-roseDark font-bold mt-3">Custom Photo Album</p>
          </div>
          <div class="my-auto px-4">
            <h2 class="font-serif text-3xl font-bold text-gray-800 leading-tight mb-2">My Photo Album</h2>
            <div class="w-16 h-0.5 bg-roseGold mx-auto my-3"></div>
            <p class="text-sm font-serif text-gray-600 italic">${files.length} Photos Loaded</p>
          </div>
          <div class="mb-4">
            <p class="text-xs text-gray-500 italic">Drag page corner to turn ➔</p>
          </div>
        </div>
      `;
      container.appendChild(coverPage);

      // Add Uploaded Photos
      files.forEach((file, index) => {
        const page = document.createElement('div');
        page.className = 'page';
        const url = URL.createObjectURL(file);
        page.innerHTML = `
          <div class="page-content">
            <div class="page-image-container" title="Click to view full screen">
              <img src="${url}" alt="Photo ${index + 1}" />
            </div>
            <div class="page-number">- ${index + 1} -</div>
          </div>
        `;
        container.appendChild(page);
      });

      // Back Cover
      const backCover = document.createElement('div');
      backCover.className = 'page page-cover';
      backCover.innerHTML = `
        <div class="page-content text-center flex flex-col justify-between items-center h-full py-10">
          <div class="my-auto">
            <span class="text-4xl text-roseGold"><i class="fa-solid fa-heart"></i></span>
            <p class="font-serif text-xl font-bold text-gray-800 mt-3">The End</p>
            <p class="text-xs text-roseDark font-semibold mt-1">Thank You for Viewing</p>
          </div>
        </div>
      `;
      container.appendChild(backCover);

      initFlipbook();
    });

    // Control Button Event Listeners
    document.getElementById('btn-next').onclick = () => pageFlip && pageFlip.flipNext();
    document.getElementById('btn-prev').onclick = () => pageFlip && pageFlip.flipPrev();
    document.getElementById('btn-first').onclick = () => pageFlip && pageFlip.flip(0);
    document.getElementById('btn-last').onclick = () => pageFlip && pageFlip.flip(pageFlip.getPageCount() - 1);

    // Lightbox Controls
    document.getElementById('close-modal').onclick = closeModal;
    document.getElementById('image-modal').onclick = (e) => {
      if (e.target.id === 'image-modal') closeModal();
    };
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    function closeModal() {
      const modal = document.getElementById('image-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // Auto Play Toggle
    const autoBtn = document.getElementById('btn-autoplay');
    const autoIcon = document.getElementById('autoplay-icon');
    autoBtn.onclick = () => {
      if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
        autoIcon.className = 'fa-solid fa-play';
        autoBtn.classList.remove('bg-roseGold', 'text-white');
        autoBtn.classList.add('bg-white', 'text-gray-700');
      } else {
        autoIcon.className = 'fa-solid fa-pause';
        autoBtn.classList.remove('bg-white', 'text-gray-700');
        autoBtn.classList.add('bg-roseGold', 'text-white');
        autoPlayInterval = setInterval(() => {
          if (pageFlip) {
            if (pageFlip.getCurrentPageIndex() >= pageFlip.getPageCount() - 1) {
              pageFlip.flip(0);
            } else {
              pageFlip.flipNext();
            }
          }
        }, 3000);
      }
    };

    // Sound Toggle
    const soundBtn = document.getElementById('btn-sound');
    const soundIcon = document.getElementById('sound-icon');
    soundBtn.onclick = () => {
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        soundIcon.className = 'fa-solid fa-volume-high';
        soundBtn.classList.add('text-roseGold');
        soundBtn.classList.remove('text-gray-400');
      } else {
        soundIcon.className = 'fa-solid fa-volume-xmark';
        soundBtn.classList.remove('text-roseGold');
        soundBtn.classList.add('text-gray-400');
      }
    };

    // Correct Full Screen Container Handling
    document.getElementById('btn-fullscreen').onclick = () => {
      const elem = document.getElementById('app-viewport');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    };

    // Initialization
    window.addEventListener('DOMContentLoaded', initFlipbook);
    window.addEventListener('resize', () => {
      if (pageFlip) initFlipbook();
    });
  </script>
</body>
</html>
