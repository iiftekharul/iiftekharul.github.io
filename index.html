<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real 3D Interactive Magazine Flipbook</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            roseGold: '#D88383',
            roseDark: '#B04E4E',
            warmCream: '#FAF7F5',
            softPaper: '#FFFDFB',
            dustyPink: '#F3D7D7',
          },
          fontFamily: {
            serif: ['Georgia', 'Cambria', 'serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FAF7F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    /* 3D Magazine Stage Setup */
    .viewport {
      perspective: 2000px;
      width: 100%;
      min-height: 540px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .book {
      width: 360px;
      height: 500px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }

    .page {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1);
      cursor: pointer;
      border-radius: 0 8px 8px 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .page-face {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      backface-visibility: hidden;
      border-radius: 0 8px 8px 0;
      overflow: hidden;
      background: #FFFDFB;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      border: 1px solid #f0e6e6;
      box-sizing: border-box;
    }

    /* Inner spine shadow for realistic magazine binding */
    .page-face::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 30px;
      height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
      z-index: 5;
    }

    .page-face.back {
      transform: rotateY(180deg);
      border-radius: 8px 0 0 8px;
    }

    .page-face.back::before {
      left: auto;
      right: 0;
      background: linear-gradient(to left, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0) 100%);
    }

    .page-cover {
      background: linear-gradient(135deg, #FAF7F5 0%, #F3D7D7 100%);
      color: #333;
      border: 2px solid #D88383;
    }

    .page-image-container {
      width: 100%;
      height: calc(100% - 35px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 6px;
      background: #fdfbfb;
      cursor: zoom-in;
    }

    .page-image-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      transition: transform 0.2s ease;
    }

    .page-image-container:hover img {
      transform: scale(1.03);
    }

    .page-number {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      font-family: Georgia, serif;
    }

    /* 3D Flip State */
    .page.flipped {
      transform: rotateY(-180deg);
    }
  </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center justify-center min-h-screen">

  <div id="flipbook-wrapper" class="w-full max-w-5xl bg-white rounded-2xl shadow-xl p-4 md:p-8 transition-all duration-300">
    
    <!-- Header Section -->
    <header class="text-center mb-6 relative">
      <span class="text-xs uppercase tracking-widest text-roseGold font-bold mb-1 block">3D Interactive Magazine</span>
      <h1 class="text-2xl md:text-3xl font-serif text-gray-800 font-bold">Custom Photo Flipbook</h1>
      <p class="text-sm text-gray-500 mt-1">Upload images to flip through realistic 3D magazine pages</p>
      
      <!-- Upload Button -->
      <div class="mt-4">
        <label for="image-upload" class="inline-flex items-center gap-2 bg-roseGold hover:bg-roseDark text-white px-5 py-2.5 rounded-lg shadow-md transition-all cursor-pointer text-sm font-semibold">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <span>Upload Images</span>
        </label>
        <input type="file" id="image-upload" multiple accept="image/*" class="hidden" />
      </div>
    </header>

    <!-- 3D Magazine Viewport Stage -->
    <div class="viewport mb-6">
      <div class="book" id="book">
        
        <!-- DEFAULT DEMO COVER & INNER PAGES -->
        <div class="page" style="z-index: 2;">
          <div class="page-face front page-cover text-center flex flex-col justify-between items-center h-full py-8">
            <div class="mt-4">
              <span class="text-3xl text-roseGold"><i class="fa-solid fa-book-open"></i></span>
              <p class="text-xs uppercase tracking-widest text-roseDark font-bold mt-2">Personalized Magazine</p>
            </div>
            <div class="my-auto px-4">
              <h2 class="font-serif text-2xl font-bold text-gray-800 leading-tight mb-3">Welcome to Your 3D Magazine</h2>
              <div class="w-16 h-0.5 bg-roseGold mx-auto my-3"></div>
              <p class="text-sm font-serif text-gray-600 italic">Click "Upload Images" above to generate your album!</p>
            </div>
            <div class="mb-4">
              <p class="text-xs text-gray-500 italic">Click page to flip ➔</p>
            </div>
          </div>
          <div class="page-face back page-cover text-center flex flex-col justify-center items-center h-full">
            <span class="text-3xl text-roseGold"><i class="fa-solid fa-heart"></i></span>
            <p class="font-serif text-lg font-bold text-gray-800 mt-2">The End</p>
          </div>
        </div>

      </div>
    </div>

    <!-- Controls Toolbar -->
    <div class="flex flex-wrap items-center justify-between gap-3 bg-warmCream p-3 rounded-xl border border-dustyPink/40">
      <div class="flex items-center gap-1 sm:gap-2">
        <button id="btn-first" title="First Page" class="p-2.5 px-3 bg-white hover:bg-roseGold hover:text-white text-gray-700 rounded-lg shadow-sm border border-gray-200 transition-colors text-sm">
          <i class="fa-solid fa-backward-step"></i>
        </button>
        <button id="btn-prev" title="Previous Page" class="p-2.5 px-3 bg-white hover:bg-roseGold hover:text-white text-gray-700 rounded-lg shadow-sm border border-gray-200 transition-colors text-sm">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <span class="text-xs md:text-sm font-serif px-2 text-gray-600 font-semibold select-none min-w-[90px] text-center" id="page-indicator">
          Page 0 of 0
        </span>
        <button id="btn-next" title="Next Page" class="p-2.5 px-3 bg-white hover:bg-roseGold hover:text-white text-gray-700 rounded-lg shadow-sm border border-gray-200 transition-colors text-sm">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
        <button id="btn-last" title="Last Page" class="p-2.5 px-3 bg-white hover:bg-roseGold hover:text-white text-gray-700 rounded-lg shadow-sm border border-gray-200 transition-colors text-sm">
          <i class="fa-solid fa-forward-step"></i>
        </button>
      </div>

      <div class="flex items-center gap-2">
        <button id="btn-autoplay" title="Toggle Auto Play" class="flex items-center gap-1.5 p-2.5 px-3 bg-white hover:bg-roseGold hover:text-white text-gray-700 rounded-lg shadow-sm border border-gray-200 transition-colors text-xs font-semibold">
          <i id="autoplay-icon" class="fa-solid fa-play"></i>
          <span class="hidden sm:inline">Auto</span>
        </button>

        <button id="btn-sound" title="Toggle Sound" class="p-2.5 px-3 bg-white hover:bg-roseGold hover:text-white text-roseGold rounded-lg shadow-sm border border-gray-200 transition-colors text-sm">
          <i id="sound-icon" class="fa-solid fa-volume-high"></i>
        </button>

        <button id="btn-fullscreen" title="Fullscreen Page View" class="p-2.5 px-3 bg-white hover:bg-roseGold hover:text-white text-gray-700 rounded-lg shadow-sm border border-gray-200 transition-colors text-sm">
          <i class="fa-solid fa-expand"></i>
        </button>
      </div>
    </div>

  </div>

  <!-- ROOT LIGHTBOX FULLSCREEN IMAGE MODAL -->
  <div id="image-modal" class="fixed inset-0 bg-black/95 z-[9999] hidden flex-col items-center justify-center p-4 backdrop-blur-md transition-opacity duration-300">
    <button id="close-modal" class="absolute top-5 right-5 text-white text-3xl p-3 hover:text-roseGold transition-colors focus:outline-none">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <img id="modal-image" src="" alt="Full Screen View" class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl" />
    <p class="text-white/70 text-xs mt-3 font-serif">Click anywhere or press ESC to exit</p>
  </div>

  <script>
    const book = document.getElementById('book');
    const imageUpload = document.getElementById('image-upload');
    const pageIndicator = document.getElementById('page-indicator');
    
    let pages = Array.from(document.querySelectorAll('.page'));
    let currentPageIndex = 0;
    let autoPlayInterval = null;
    let soundEnabled = true;

    // Web Audio Synthesizer for 3D Magazine Page Flip Sound
    function playPageTurnSound() {
      if (!soundEnabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        const bufferSize = ctx.sampleRate * 0.15;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1000, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.12);
        filter.Q.value = 1.5;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.01, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        noise.start();
        noise.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }

    function updatePageZIndex() {
      pages.forEach((page, index) => {
        if (index < currentPageIndex) {
          page.classList.add('flipped');
          page.style.zIndex = index;
        } else {
          page.classList.remove('flipped');
          page.style.zIndex = pages.length - index;
        }
      });
      pageIndicator.textContent = `Page ${currentPageIndex} of ${pages.length}`;
      attachImageLightbox();
    }

    function flipNext() {
      if (currentPageIndex < pages.length) {
        currentPageIndex++;
        playPageTurnSound();
        updatePageZIndex();
      }
    }

    function flipPrev() {
      if (currentPageIndex > 0) {
        currentPageIndex--;
        playPageTurnSound();
        updatePageZIndex();
      }
    }

    // Dynamic Upload Handler
    imageUpload.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      book.innerHTML = '';
      pages = [];
      currentPageIndex = 0;

      const imageUrls = files.map(file => URL.createObjectURL(file));

      // Build Front Cover Page
      const coverPage = document.createElement('div');
      coverPage.className = 'page';
      coverPage.innerHTML = `
        <div class="page-face front page-cover text-center flex flex-col justify-between items-center h-full py-8">
          <div class="mt-4">
            <span class="text-3xl text-roseGold"><i class="fa-solid fa-images"></i></span>
            <p class="text-xs uppercase tracking-widest text-roseDark font-bold mt-2">Custom Photo Album</p>
          </div>
          <div class="my-auto px-4">
            <h2 class="font-serif text-2xl font-bold text-gray-800 leading-tight mb-2">My Photo Album</h2>
            <div class="w-16 h-0.5 bg-roseGold mx-auto my-3"></div>
            <p class="text-sm font-serif text-gray-600 italic">${files.length} Photos Loaded</p>
          </div>
          <div class="mb-4">
            <p class="text-xs text-gray-500 italic">Click page to flip ➔</p>
          </div>
        </div>
        <div class="page-face back">
          ${imageUrls[0] ? `<div class="page-image-container"><img src="${imageUrls[0]}" /></div><div class="page-number">- 1 -</div>` : ''}
        </div>
      `;
      book.appendChild(coverPage);
      pages.push(coverPage);

      // Group images into double-sided magazine sheets
      for (let i = 1; i < imageUrls.length; i += 2) {
        const frontImg = imageUrls[i];
        const backImg = imageUrls[i + 1] || null;

        const pageEl = document.createElement('div');
        pageEl.className = 'page';

        pageEl.innerHTML = `
          <div class="page-face front">
            <div class="page-image-container">
              <img src="${frontImg}" />
            </div>
            <div class="page-number">- ${i + 1} -</div>
          </div>
          <div class="page-face back">
            ${backImg ? `
              <div class="page-image-container">
                <img src="${backImg}" />
              </div>
              <div class="page-number">- ${i + 2} -</div>
            ` : `
              <div class="page-content text-center flex flex-col justify-center items-center h-full">
                <span class="text-3xl text-roseGold"><i class="fa-solid fa-heart"></i></span>
                <p class="font-serif text-lg font-bold text-gray-800 mt-2">The End</p>
              </div>
            `}
          </div>
        `;

        book.appendChild(pageEl);
        pages.push(pageEl);
      }

      // Add click handlers on pages for direct flipping
      pages.forEach(page => {
        page.addEventListener('click', (evt) => {
          if (evt.target.tagName !== 'IMG') {
            if (page.classList.contains('flipped')) {
              flipPrev();
            } else {
              flipNext();
            }
          }
        });
      });

      updatePageZIndex();
    });

    // Lightbox Fullscreen Modal Handler
    function attachImageLightbox() {
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-image');

      document.querySelectorAll('.page-image-container img').forEach(img => {
        img.onclick = (e) => {
          e.stopPropagation();
          modalImg.src = img.src;
          modal.classList.remove('hidden');
          modal.classList.add('flex');
        };
      });
    }

    document.getElementById('close-modal').onclick = () => {
      const modal = document.getElementById('image-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    };

    document.getElementById('image-modal').onclick = (e) => {
      if (e.target.id === 'image-modal') {
        const modal = document.getElementById('image-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    };

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const modal = document.getElementById('image-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    });

    // Button Controls
    document.getElementById('btn-next').onclick = flipNext;
    document.getElementById('btn-prev').onclick = flipPrev;
    document.getElementById('btn-first').onclick = () => {
      currentPageIndex = 0;
      playPageTurnSound();
      updatePageZIndex();
    };
    document.getElementById('btn-last').onclick = () => {
      currentPageIndex = pages.length;
      playPageTurnSound();
      updatePageZIndex();
    };

    // AutoPlay Toggle
    const autoBtn = document.getElementById('btn-autoplay');
    const autoIcon = document.getElementById('autoplay-icon');
    autoBtn.onclick = () => {
      if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
        autoIcon.className = 'fa-solid fa-play';
        autoBtn.classList.remove('bg-roseGold', 'text-white');
        autoBtn.classList.add('bg-white', 'text-gray-700');
      } else {
        autoIcon.className = 'fa-solid fa-pause';
        autoBtn.classList.remove('bg-white', 'text-gray-700');
        autoBtn.classList.add('bg-roseGold', 'text-white');
        autoPlayInterval = setInterval(() => {
          if (currentPageIndex >= pages.length) {
            currentPageIndex = 0;
          } else {
            currentPageIndex++;
          }
          playPageTurnSound();
          updatePageZIndex();
        }, 3000);
      }
    };

    // Sound Toggle
    const soundBtn = document.getElementById('btn-sound');
    const soundIcon = document.getElementById('sound-icon');
    soundBtn.onclick = () => {
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        soundIcon.className = 'fa-solid fa-volume-high';
        soundBtn.classList.add('text-roseGold');
        soundBtn.classList.remove('text-gray-400');
      } else {
        soundIcon.className = 'fa-solid fa-volume-xmark';
        soundBtn.classList.remove('text-roseGold');
        soundBtn.classList.add('text-gray-400');
      }
    };

    // Native Browser Stage Fullscreen Toggle
    document.getElementById('btn-fullscreen').onclick = () => {
      const elem = document.documentElement;
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    };

    updatePageZIndex();
  </script>
</body>
</html>
