<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Interactive Flipbook</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PageFlip Browser Version (Native 3D Page Curling Engine) -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Main Container (No Title/Header) */
    .app-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    /* 3D Viewport Stage */
    .stage {
      width: 100%;
      min-height: 72vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* PageFlip Mount Element */
    #flipbook {
      margin: 0 auto;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
    }

    /* Page Styles */
    .page {
      background-color: #ffffff;
      color: #1e293b;
      overflow: hidden;
      border: 1px solid #cbd5e1;
      box-sizing: border-box;
    }

    .page-cover {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      border: 2px solid #38bdf8;
    }

    .page-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
      position: relative;
      box-sizing: border-box;
    }

    .page-image-container {
      width: 100%;
      height: calc(100% - 25px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 6px;
      background: #f1f5f9;
      cursor: pointer;
    }

    .page-image-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: auto;
    }

    .page-number {
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 600;
    }

    /* Toolbar Styling */
    .controls-bar {
      width: 100%;
      max-width: 900px;
      margin-top: 15px;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 10px 18px;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .nav-btn {
      background: #334155;
      color: #f8fafc;
      padding: 8px 14px;
      border-radius: 6px;
      transition: all 0.2s ease;
      font-size: 0.9rem;
    }

    .nav-btn:hover {
      background: #0284c7;
      color: white;
    }

    .upload-btn {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }

    .upload-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="app-container" id="app-container">
    
    <!-- 3D Stage -->
    <div class="stage" id="stage">
      <div id="flipbook">
        
        <!-- DEFAULT FRONT COVER -->
        <div class="page page-cover">
          <div class="page-content text-center flex flex-col justify-between items-center h-full py-8">
            <div class="mt-4">
              <span class="text-4xl text-sky-400"><i class="fa-solid fa-book-open"></i></span>
              <p class="text-xs uppercase tracking-widest text-sky-300 font-bold mt-3">3D Interactive Album</p>
            </div>
            <div class="my-auto px-4">
              <h2 class="text-2xl font-bold leading-tight mb-2">Welcome!</h2>
              <p class="text-sm text-slate-300 italic">Click "Upload Images" below or drag page corners to flip!</p>
            </div>
            <div class="mb-4">
              <p class="text-xs text-slate-400 italic">Drag corner to turn page ➔</p>
            </div>
          </div>
        </div>

        <!-- DEFAULT INSIDE DEMO -->
        <div class="page">
          <div class="page-content text-center flex flex-col justify-center items-center h-full">
            <h3 class="text-lg font-bold text-slate-700 mb-2">Drag Corners With Mouse</h3>
            <p class="text-xs text-slate-500 px-4">Click & hold any page corner with your mouse to experience authentic 3D page curling.</p>
            <div class="page-number">- 1 -</div>
          </div>
        </div>

        <!-- DEFAULT BACK COVER -->
        <div class="page page-cover">
          <div class="page-content text-center flex flex-col justify-center items-center h-full py-8">
            <span class="text-3xl text-sky-400"><i class="fa-solid fa-heart"></i></span>
            <p class="text-base font-bold mt-2">The End</p>
          </div>
        </div>

      </div>
    </div>

    <!-- Controls Toolbar (Contains Upload & Navigation) -->
    <div class="controls-bar">
      
      <!-- Upload Button inside Controls -->
      <label for="image-upload" class="upload-btn">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <span>Upload Images</span>
      </label>
      <input type="file" id="image-upload" multiple accept="image/*" class="hidden" />

      <!-- Page Controls -->
      <div class="flex items-center gap-2">
        <button id="btn-first" class="nav-btn" title="First Page"><i class="fa-solid fa-backward-step"></i></button>
        <button id="btn-prev" class="nav-btn" title="Previous Page"><i class="fa-solid fa-chevron-left"></i></button>
        <span id="page-indicator" class="text-xs font-semibold px-2 text-slate-300 min-w-[90px] text-center">Page 1 of 3</span>
        <button id="btn-next" class="nav-btn" title="Next Page"><i class="fa-solid fa-chevron-right"></i></button>
        <button id="btn-last" class="nav-btn" title="Last Page"><i class="fa-solid fa-forward-step"></i></button>
      </div>

      <!-- Extra Action Controls -->
      <div class="flex items-center gap-2">
        <button id="btn-autoplay" class="nav-btn" title="Auto Play"><i id="autoplay-icon" class="fa-solid fa-play"></i></button>
        <button id="btn-sound" class="nav-btn text-sky-400" title="Sound Toggle"><i id="sound-icon" class="fa-solid fa-volume-high"></i></button>
        <button id="btn-fullscreen" class="nav-btn" title="Full Screen"><i class="fa-solid fa-expand"></i></button>
      </div>

    </div>

  </div>

  <!-- FULLSCREEN IMAGE LIGHTBOX MODAL -->
  <div id="image-modal" class="fixed inset-0 bg-black/95 z-[99999] hidden flex-col items-center justify-center p-4 backdrop-blur-md">
    <button id="close-modal" class="absolute top-5 right-5 text-white text-3xl p-3 hover:text-sky-400 transition-colors focus:outline-none">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <img id="modal-image" src="" alt="Full Screen View" class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl" />
    <p class="text-white/70 text-xs mt-3">Click anywhere or press ESC to close</p>
  </div>

  <script>
    let pageFlip = null;
    let autoPlayInterval = null;
    let soundEnabled = true;

    // Web Audio Synthesizer for Paper Sound
    function playPageTurnSound() {
      if (!soundEnabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        const bufferSize = ctx.sampleRate * 0.15;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1000, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.12);
        filter.Q.value = 1.5;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.01, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        noise.start();
        noise.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }

    // Dynamic Aspect Ratio Sizing
    function getDimensions() {
      const w = window.innerWidth;
      if (w < 640) {
        return { width: 300, height: 420 };
      } else if (w < 1024) {
        return { width: 380, height: 520 };
      } else {
        return { width: 450, height: 600 }; // High quality aspect ratio
      }
    }

    function initFlipbook() {
      const container = document.getElementById('flipbook');
      const dims = getDimensions();

      if (pageFlip) {
        try { pageFlip.destroy(); } catch (e) {}
        pageFlip = null;
      }

      pageFlip = new St.PageFlip(container, {
        width: dims.width,
        height: dims.height,
        size: "fixed",
        minWidth: 280,
        maxWidth: 600,
        minHeight: 380,
        maxHeight: 800,
        drawShadow: true,
        showCover: true,
        usePortrait: window.innerWidth < 640,
        maxShadowOpacity: 0.6,
        flippingTime: 800,
        useMouseEvents: true, // Enables native 3D Mouse Dragging
        swipeDistance: 20
      });

      const pages = container.querySelectorAll('.page');
      pageFlip.loadFromHTML(pages);

      pageFlip.on('flip', (e) => {
        playPageTurnSound();
        updateIndicator();
      });

      updateIndicator();
      attachImageEvents();
    }

    function updateIndicator() {
      if (!pageFlip) return;
      const current = pageFlip.getCurrentPageIndex() + 1;
      const total = pageFlip.getPageCount();
      document.getElementById('page-indicator').innerText = `Page ${current} of ${total}`;
    }

    function attachImageEvents() {
      document.querySelectorAll('.page-image-container img').forEach(img => {
        img.onclick = (e) => {
          e.stopPropagation();
          document.getElementById('modal-image').src = img.src;
          const modal = document.getElementById('image-modal');
          modal.classList.remove('hidden');
          modal.classList.add('flex');
        };
      });
    }

    // Dynamic Image Upload
    document.getElementById('image-upload').addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      const stage = document.getElementById('stage');
      stage.innerHTML = '<div id="flipbook"></div>';
      const container = document.getElementById('flipbook');

      // Front Cover
      const coverPage = document.createElement('div');
      coverPage.className = 'page page-cover';
      coverPage.innerHTML = `
        <div class="page-content text-center flex flex-col justify-between items-center h-full py-8">
          <div class="mt-4">
            <span class="text-4xl text-sky-400"><i class="fa-solid fa-images"></i></span>
            <p class="text-xs uppercase tracking-widest text-sky-300 font-bold mt-3">Photo Album</p>
          </div>
          <div class="my-auto px-4">
            <h2 class="text-2xl font-bold leading-tight mb-2">My Photo Album</h2>
            <p class="text-sm text-slate-300 italic">${files.length} Images Loaded</p>
          </div>
          <div class="mb-4">
            <p class="text-xs text-slate-400 italic">Drag page corner to turn ➔</p>
          </div>
        </div>
      `;
      container.appendChild(coverPage);

      // Uploaded Images
      files.forEach((file, index) => {
        const page = document.createElement('div');
        page.className = 'page';
        const url = URL.createObjectURL(file);
        page.innerHTML = `
          <div class="page-content">
            <div class="page-image-container" title="Click to view full screen">
              <img src="${url}" alt="Photo ${index + 1}" />
            </div>
            <div class="page-number">- ${index + 1} -</div>
          </div>
        `;
        container.appendChild(page);
      });

      // Back Cover
      const backCover = document.createElement('div');
      backCover.className = 'page page-cover';
      backCover.innerHTML = `
        <div class="page-content text-center flex flex-col justify-center items-center h-full py-8">
          <span class="text-3xl text-sky-400"><i class="fa-solid fa-heart"></i></span>
          <p class="text-base font-bold mt-2">The End</p>
        </div>
      `;
      container.appendChild(backCover);

      initFlipbook();
    });

    // Control Handlers
    document.getElementById('btn-next').onclick = () => pageFlip && pageFlip.flipNext();
    document.getElementById('btn-prev').onclick = () => pageFlip && pageFlip.flipPrev();
    document.getElementById('btn-first').onclick = () => pageFlip && pageFlip.flip(0);
    document.getElementById('btn-last').onclick = () => pageFlip && pageFlip.flip(pageFlip.getPageCount() - 1);

    // Lightbox Modal Controls
    document.getElementById('close-modal').onclick = closeModal;
    document.getElementById('image-modal').onclick = (e) => {
      if (e.target.id === 'image-modal') closeModal();
    };
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    function closeModal() {
      const modal = document.getElementById('image-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // Auto Play Toggle
    const autoBtn = document.getElementById('btn-autoplay');
    const autoIcon = document.getElementById('autoplay-icon');
    autoBtn.onclick = () => {
      if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
        autoIcon.className = 'fa-solid fa-play';
      } else {
        autoIcon.className = 'fa-solid fa-pause';
        autoPlayInterval = setInterval(() => {
          if (pageFlip) {
            if (pageFlip.getCurrentPageIndex() >= pageFlip.getPageCount() - 1) {
              pageFlip.flip(0);
            } else {
              pageFlip.flipNext();
            }
          }
        }, 3000);
      }
    };

    // Sound Toggle
    const soundBtn = document.getElementById('btn-sound');
    const soundIcon = document.getElementById('sound-icon');
    soundBtn.onclick = () => {
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        soundIcon.className = 'fa-solid fa-volume-high';
        soundBtn.classList.add('text-sky-400');
      } else {
        soundIcon.className = 'fa-solid fa-volume-xmark';
        soundBtn.classList.remove('text-sky-400');
      }
    };

    // Full Screen Toggle
    document.getElementById('btn-fullscreen').onclick = () => {
      const elem = document.documentElement;
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    };

    // Window Init
    window.addEventListener('DOMContentLoaded', initFlipbook);
    window.addEventListener('resize', () => {
      if (pageFlip) initFlipbook();
    });
  </script>
</body>
</html>
