<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pure Native 3D Flipbook</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #FAF7F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Container Wrapper */
    .flipbook-app {
      width: 100%;
      max-width: 1050px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 3D Viewport Stage */
    .viewport {
      perspective: 2000px;
      width: 100%;
      height: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      user-select: none;
    }

    /* 3D Book Container */
    .book {
      width: 380px;
      height: 500px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Native 3D Page Sheet */
    .page {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
      cursor: pointer;
      border-radius: 0 8px 8px 0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    }

    /* Page Front and Back Faces */
    .page-face {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      backface-visibility: hidden;
      border-radius: 0 8px 8px 0;
      overflow: hidden;
      background: #FFFDFB;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      border: 1px solid #f0e6e6;
      box-sizing: border-box;
    }

    /* Spine Shadow Effect */
    .page-face::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 35px;
      height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
      z-index: 5;
    }

    .page-face.back {
      transform: rotateY(180deg);
      border-radius: 8px 0 0 8px;
    }

    .page-face.back::before {
      left: auto;
      right: 0;
      background: linear-gradient(to left, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0) 100%);
    }

    .page-cover {
      background: linear-gradient(135deg, #FAF7F5 0%, #F3D7D7 100%);
      color: #333;
      border: 2px solid #D88383;
    }

    .page-image-container {
      width: 100%;
      height: calc(100% - 30px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 8px;
      background: #fdfbfb;
      cursor: zoom-in;
    }

    .page-image-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: auto;
    }

    .page-number {
      text-align: center;
      font-size: 0.75rem;
      color: #888888;
      font-family: Georgia, serif;
    }

    /* Page Flipped CSS State */
    .page.flipped {
      transform: rotateY(-180deg);
    }

    /* Controls Toolbar */
    .toolbar {
      width: 100%;
      background: #FAF7F5;
      border: 1px solid #F3D7D7;
      padding: 12px 20px;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 15px;
    }

    .btn {
      background: #ffffff;
      color: #333;
      border: 1px solid #e2e8f0;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #D88383;
      color: white;
      border-color: #D88383;
    }

    .btn-upload {
      background: #D88383;
      color: white;
      border: none;
    }

    .btn-upload:hover {
      background: #B04E4E;
    }

    /* Lightbox Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .modal.active {
      display: flex;
    }

    .modal img {
      max-width: 90%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .close-modal {
      position: absolute;
      top: 20px;
      right: 25px;
      color: white;
      font-size: 2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="flipbook-app" id="app-wrapper">
    
    <!-- 3D Stage -->
    <div class="viewport">
      <div class="book" id="book">
        
        <!-- DEFAULT DEMO PAGES -->
        <div class="page" style="z-index: 2;">
          <div class="page-face front page-cover" style="text-align: center; justify-content: center;">
            <h2 style="font-size: 1.5rem; color: #B04E4E; margin-bottom: 10px;">3D Interactive Flipbook</h2>
            <p style="font-size: 0.85rem; color: #666;">Click page or drag mouse to turn!</p>
          </div>
          <div class="page-face back" style="text-align: center; justify-content: center;">
            <p style="font-size: 0.9rem; color: #555;">Click <b>"Upload Images"</b> below to build your custom photo album.</p>
          </div>
        </div>

        <div class="page" style="z-index: 1;">
          <div class="page-face front" style="text-align: center; justify-content: center;">
            <p style="font-size: 0.9rem; color: #555;">Pure Native HTML5 & CSS 3D Engine.</p>
            <div class="page-number">- 1 -</div>
          </div>
          <div class="page-face back page-cover" style="text-align: center; justify-content: center;">
            <h3 style="font-size: 1.2rem; color: #B04E4E;">The End</h3>
          </div>
        </div>

      </div>
    </div>

    <!-- Controls -->
    <div class="toolbar">
      <label for="image-upload" class="btn btn-upload">
        📷 Upload Images
      </label>
      <input type="file" id="image-upload" multiple accept="image/*" style="display: none;" />

      <div style="display: flex; gap: 8px; align-items: center;">
        <button class="btn" id="btn-first">⏮ First</button>
        <button class="btn" id="btn-prev">◀ Prev</button>
        <span id="page-indicator" style="font-size: 0.85rem; font-weight: 600; color: #555; padding: 0 8px;">Page 0 of 0</span>
        <button class="btn" id="btn-next">Next ▶</button>
        <button class="btn" id="btn-last">Last ⏭</button>
      </div>

      <div style="display: flex; gap: 8px;">
        <button class="btn" id="btn-autoplay">▶ Auto</button>
        <button class="btn" id="btn-sound">🔊 Sound</button>
        <button class="btn" id="btn-fullscreen">⛶ Fullscreen</button>
      </div>
    </div>

  </div>

  <!-- Fullscreen Modal -->
  <div class="modal" id="image-modal">
    <span class="close-modal" id="close-modal">&times;</span>
    <img id="modal-image" src="" alt="Full Screen" />
  </div>

  <script>
    const book = document.getElementById('book');
    const imageUpload = document.getElementById('image-upload');
    const pageIndicator = document.getElementById('page-indicator');
    
    let pages = [];
    let currentPageIndex = 0;
    let autoPlayInterval = null;
    let soundEnabled = true;

    // Web Audio Synthesizer for Paper Sound Effect
    function playPageTurnSound() {
      if (!soundEnabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        const bufferSize = ctx.sampleRate * 0.15;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1000, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.12);
        filter.Q.value = 1.5;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.01, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        noise.start();
        noise.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }

    function initPages() {
      pages = Array.from(book.querySelectorAll('.page'));
      updatePageZIndex();
    }

    function updatePageZIndex() {
      pages.forEach((page, index) => {
        if (index < currentPageIndex) {
          page.classList.add('flipped');
          page.style.zIndex = index;
        } else {
          page.classList.remove('flipped');
          page.style.zIndex = pages.length - index;
        }
      });
      pageIndicator.textContent = `Page ${currentPageIndex} of ${pages.length}`;
      attachImageEvents();
    }

    function flipNext() {
      if (currentPageIndex < pages.length) {
        currentPageIndex++;
        playPageTurnSound();
        updatePageZIndex();
      }
    }

    function flipPrev() {
      if (currentPageIndex > 0) {
        currentPageIndex--;
        playPageTurnSound();
        updatePageZIndex();
      }
    }

    // Direct Mouse Click / Drag Gesture on Pages
    let startX = 0;
    book.addEventListener('mousedown', (e) => {
      startX = e.clientX;
    });

    book.addEventListener('mouseup', (e) => {
      const diffX = e.clientX - startX;
      if (Math.abs(diffX) > 30) {
        if (diffX < 0) flipNext(); // Drag Left to Flip Next
        else flipPrev();          // Drag Right to Flip Prev
      } else {
        // Simple Click Handling
        if (e.target.tagName !== 'IMG') {
          const rect = book.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          if (clickX > rect.width / 2) flipNext();
          else flipPrev();
        }
      }
    });

    // Dynamic Image Upload
    imageUpload.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      book.innerHTML = '';
      pages = [];
      currentPageIndex = 0;

      const imageUrls = files.map(file => URL.createObjectURL(file));

      // Front Cover
      const coverPage = document.createElement('div');
      coverPage.className = 'page';
      coverPage.innerHTML = `
        <div class="page-face front page-cover" style="text-align: center; justify-content: center;">
          <h2 style="font-size: 1.5rem; color: #B04E4E;">My Photo Album</h2>
          <p style="font-size: 0.85rem; color: #666; margin-top: 8px;">${files.length} Photos Loaded</p>
        </div>
        <div class="page-face back">
          ${imageUrls[0] ? `<div class="page-image-container"><img src="${imageUrls[0]}" /></div><div class="page-number">- 1 -</div>` : ''}
        </div>
      `;
      book.appendChild(coverPage);

      // Inner Pages
      for (let i = 1; i < imageUrls.length; i += 2) {
        const frontImg = imageUrls[i];
        const backImg = imageUrls[i + 1] || null;

        const pageEl = document.createElement('div');
        pageEl.className = 'page';
        pageEl.innerHTML = `
          <div class="page-face front">
            <div class="page-image-container"><img src="${frontImg}" /></div>
            <div class="page-number">- ${i + 1} -</div>
          </div>
          <div class="page-face back">
            ${backImg ? `<div class="page-image-container"><img src="${backImg}" /></div><div class="page-number">- ${i + 2} -</div>` : '<div class="page-content" style="justify-content:center; text-align:center;"><h3>The End</h3></div>'}
          </div>
        `;
        book.appendChild(pageEl);
      }

      initPages();
    });

    // Fullscreen Image Lightbox
    function attachImageEvents() {
      document.querySelectorAll('.page-image-container img').forEach(img => {
        img.onclick = (e) => {
          e.stopPropagation();
          document.getElementById('modal-image').src = img.src;
          document.getElementById('image-modal').classList.add('active');
        };
      });
    }

    document.getElementById('close-modal').onclick = closeModal;
    document.getElementById('image-modal').onclick = (e) => {
      if (e.target.id === 'image-modal') closeModal();
    };

    function closeModal() {
      document.getElementById('image-modal').classList.remove('active');
    }

    // Button Listeners
    document.getElementById('btn-next').onclick = flipNext;
    document.getElementById('btn-prev').onclick = flipPrev;
    document.getElementById('btn-first').onclick = () => { currentPageIndex = 0; playPageTurnSound(); updatePageZIndex(); };
    document.getElementById('btn-last').onclick = () => { currentPageIndex = pages.length; playPageTurnSound(); updatePageZIndex(); };

    // Auto Play
    const autoBtn = document.getElementById('btn-autoplay');
    autoBtn.onclick = () => {
      if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
        autoBtn.textContent = '▶ Auto';
      } else {
        autoBtn.textContent = '⏸ Pause';
        autoPlayInterval = setInterval(() => {
          if (currentPageIndex >= pages.length) currentPageIndex = 0;
          else currentPageIndex++;
          playPageTurnSound();
          updatePageZIndex();
        }, 3000);
      }
    };

    // Sound
    const soundBtn = document.getElementById('btn-sound');
    soundBtn.onclick = () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊 Sound' : '🔇 Mute';
    };

    // Fullscreen Mode
    document.getElementById('btn-fullscreen').onclick = () => {
      const elem = document.documentElement;
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    };

    // Start App
    initPages();
  </script>
</body>
</html>
